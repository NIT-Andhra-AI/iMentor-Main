
<div style="background:#070d1a; border:1px solid #1e2d4a; border-radius:8px; padding:20px; text-align:center; margin:16px 0;">
  <svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">
    <!-- Grid -->
    <defs>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111d33" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- Source -->
    <circle cx="80" cy="110" r="30" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="115" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">V_in</text>
    
    <!-- Switch / Active Device -->
    <line x1="110" y1="110" x2="220" y2="110" stroke="#94a3b8" stroke-width="2"/>
    <rect x="220" y="85" width="80" height="50" rx="6" fill="#1e293b" stroke="#d4a853" stroke-width="2"/>
    <text x="260" y="115" fill="#d4a853" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Switch Q1</text>

    <!-- Inductor L -->
    <line x1="300" y1="110" x2="380" y2="110" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 380 110 Q 395 85 410 110 Q 425 85 440 110 Q 455 85 470 110" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <text x="425" y="80" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Inductor L</text>

    <!-- Capacitor C & Load R -->
    <line x1="470" y1="110" x2="580" y2="110" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Load -->
    <rect x="550" y="85" width="50" height="50" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="575" y="115" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">R_L</text>

    <!-- Return Rail -->
    <line x1="580" y1="170" x2="80" y2="170" stroke="#94a3b8" stroke-width="2"/>
    <line x1="80" y1="140" x2="80" y2="170" stroke="#94a3b8" stroke-width="2"/>
    <line x1="575" y1="135" x2="575" y2="170" stroke="#94a3b8" stroke-width="2"/>

    <!-- Ground -->
    <line x1="330" y1="170" x2="330" y2="190" stroke="#94a3b8" stroke-width="2"/>
    <line x1="315" y1="190" x2="345" y2="190" stroke="#94a3b8" stroke-width="2"/>
    <line x1="322" y1="195" x2="338" y2="195" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="340" y="35" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Generate circuit schematic for Buck converter with freewheeling diode and critical inductance formula</text>
  </svg>
</div>